<!-- prettier-ignore -->
{% extends 'task5_ems/base.html' %} 
{% block title %}Registration{% endblock %}
{% block page %}
<h2 class="text-2xl font-bold mb-4 text-center">
  Registration Form for <br />
  <span class="text-gray-600">{{ event_title }}</span>
</h2>
<form
  action="{% url 'task5_ems:register_event' event_id %}"
  method="post"
  class="max-w-2xl mx-auto p-3 lg:p-4 border border-gray-300 rounded-lg"
>
  {% csrf_token %} {{ form.as_p }}
  <button
    type="submit"
    class="bg-gray-900 text-gray-50 px-4 py-2 rounded cursor-pointer"
  >
    Submit
  </button>
</form>
{% endblock %}

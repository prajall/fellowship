{% extends "task2_ecom/base.html" %} {% block content %}
<div class="max-w-5xl mx-auto lg:px-4 mt-5">
  <p class="text-gray-500 mb-2 text-xs">{{post.created_at | date:"F j,Y"}}</p>
  <h1 class="text-4xl font-bold text-gray-800 mb-6">{{ post.title }}</h1>

  {% if post.image %}
  <div class="w-full mb-8">
    <img
      src="{{ post.image.url }}"
      alt="{{ post.title }}"
      class="rounded-lg shadow-lg w-full object-cover max-h-[500px] mx-auto"
    />
  </div>

  {% endif %}

  <div class="text-gray-800 text-justify">{{ post.content|linebreaks }}</div>
  <p class="text-gray-500 mt-10 text-xs text-end">- {{post.author}}</p>

  <p class="text-xs text-gray-700 mt-10">Actions:</p>
  <form
    method="post"
    action="{% url 'task1_blog:delete_blog' post.id %}"
    onsubmit="return confirm('Are you sure you want to delete this post?');"
  >
    <a
      href="{% url 'task1_blog:edit_blog' post.id %}"
      class="text-xs hover:underline"
      >Edit</a
    >
    {% csrf_token %}
    <button
      type="submit"
      class="text-xs text-red-500 cursor-pointer hover:underline ml-5"
    >
      Delete
    </button>
  </form>
</div>
{% endblock %}

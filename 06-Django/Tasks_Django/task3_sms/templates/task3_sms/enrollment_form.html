{% extends 'task3_sms/base.html' %} 
{% block title %}Add Enrollment{% endblock %} 
{% block page %}
<h2 class="text-2xl font-bold mb-4 text-center">Add Enrollment</h2>

<form
  method="post"
  class="border border-gray-300 max-w-2xl p-4 rounded-lg mx-auto"
>
  {% csrf_token %} {{ form.as_p }}

    Submit
  </button>
</form>
{% endblock %}

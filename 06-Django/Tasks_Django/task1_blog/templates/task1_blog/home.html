{% extends "task1_blog/base.html" %} {% block content %}
<div class="max-w-4xl mx-auto">
  <h2 class="text-4xl font-bold text-center mb-10">All Blogs</h2>

  <div class="mb-6 flex justify-end">
    <form action="{% url 'task1_blog:home_view' %}">
      <label for="author">Author:</label>
      <select name="author" class="border border-gray-300 rounded p-1 mr-4">
        <option value="">All</option>
        {% for author in authors %}
        <option value="{{author.id}}">{{author.name}}</option>
        {%endfor%}
      </select>
      <label for="author">Category:</label>
      <select name="category" class="border border-gray-300 rounded p-1">
        <option value="">All</option>
        {% for category in categories %}
        <option value="{{category.id}}">{{category.category}}</option>
        {%endfor%}
      </select>
      <button
        type="submit"
        class="mx-2 px-3 py-1 rounded-md cursor-pointer bg-gray-900 text-white"
      >
        Apply
      </button>
    </form>
  </div>
  <div class="space-y-8">
    {% for p in posts %}
    <div
      class="bg-white rounded-lg p-3 md:p-4 lg:p-6 flex flex-col md:flex-row gap-6 border border-gray-200"
    >
      <div class="w-full flex flex-col justify-between">
        <div>
          <a
            href="{% url 'task1_blog:detail' p.id  %}"
            class="hover:underline underline-offset-2"
          >
            <h3 class="text-2xl font-semibold mb-2 text-gray-800">
              {{ p.title }}
            </h3>
          </a>
          <p class="text-gray-600 mb-4 text-justify">
            {{ p.content|truncatewords:30 }}
          </p>
        </div>

        <div class="text-sm text-gray-500 w-full flex justify-between gap-4">
          <span class="text-xs">Category: {{ p.category }}</span>
          <span class="ml-auto text-xs">By {{ p.author }} </span>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}

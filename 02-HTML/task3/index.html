<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 - Dashboard Layout</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="utils.css" />
  </head>
  <body>
    <header>
      <nav class="wrapper-screen flex">
        <div class="logo">P<span>M</span></div>
        <div class="user_profile">
          <img
            src="https://cdn-icons-png.flaticon.com/512/219/219983.png"
            alt=""
          />
          <p>User</p>
        </div>
      </nav>
    </header>
    <aside class="close wrapper">
      <button id="toggle-sidebar" class="sidebar-toggle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#000"
        >
          <path
            d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm440-80h120v-560H640v560Zm-80 0v-560H200v560h360Zm80 0h120-120Z"
          />
        </svg>
      </button>
      <div class="sidebar-content">
        <p class="-red">Sidebar</p>
      </div>
    </aside>
    <main class="wrapper">
      <section class="dashboard">
        <p>Product Sales</p>
        <div class="wrapper canvas-container">
          <canvas id="canvas"></canvas>
        </div>
      </section>
    </main>
  </body>
  <script src="script.js"></script>
</html>

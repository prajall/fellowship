<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2 - Product Card Grid Layout</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="product.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="wrapper">
        <div class="logo">P<span class="red">M</span></div>
        <div class="hamburger" id="hamburger">
          <div class="burger1 line"></div>
          <div class="burger2 line"></div>
          <div class="burger3 line"></div>
        </div>

        <div class="nav_menu_mobile hide" id="navMenuMobile">
          <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contacts</li>
            <li>Projects</li>
          </ul>
        </div>

        <div class="nav_menu" id="navMenu">
          <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contacts</li>
            <li>Projects</li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="product-grid wrapper">
      <div
        class="product-card"
        data-product-name="Nike Men's Sneaker"
        data-product-price="59.99"
      >
        <div class="img-wrapper">
          <img
            src="https://images.pexels.com/photos/30755567/pexels-photo-30755567.jpeg"
            alt="Sneakers"
          />
        </div>
        <div class="product-info">
          <div class="flex space-between">
            <div>
              <h2>Nike Men's Sneaker</h2>
              <p class="sub-title">Men's Collection</p>
            </div>
            <p>$59.99</p>
          </div>
          <button>Add to Cart</button>
        </div>
      </div>
      <div
        class="product-card"
        data-product-name="Backpack"
        data-product-price="79.99"
      >
        <div class="img-wrapper">
          <img
            src="https://images.pexels.com/photos/3908800/pexels-photo-3908800.jpeg"
            alt="backpack"
          />
        </div>
        <div class="product-info">
          <div class="flex space-between">
            <div>
              <h2>Backpack</h2>
              <p class="sub-title">Women's Collection</p>
            </div>
            <p>$79.99</p>
          </div>
          <button>Add to Cart</button>
        </div>
      </div>
      <div class="product-card">
        <div class="img-wrapper">
          <img
            src="https://images.pexels.com/photos/9561297/pexels-photo-9561297.jpeg"
            alt="Watch"
          />
        </div>
        <div
          class="product-info"
          data-product-name="Rolex Diamond Watch"
          data-product-price="129.99"
        >
          <div class="flex space-between">
            <div>
              <h2>Rolex Diamond Watch</h2>
              <p class="sub-title">Men's Collection</p>
            </div>
            <p>$129.99</p>
          </div>
          <button>Add to Cart</button>
        </div>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
